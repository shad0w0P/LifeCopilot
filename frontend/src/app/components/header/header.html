<!-- Unified Header Widget (Presentational) -->
<header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6 mb-8">
  <div>
    <h2 class="text-3xl font-bold tracking-tight text-white">
      Welcome back, {{ firstName || 'User' }}!
    </h2>
    <p class="text-slate-400 text-sm mt-1">Here is the status of your LifeCopilot personal assistant.</p>
  </div>
  <div class="flex items-center gap-4">
    <div class="hidden sm:flex flex-col text-right">
      <span class="text-xs text-slate-500">Logged in as</span>
      <span class="text-sm font-semibold text-slate-300 truncate max-w-[200px]" title="{{ email }}">{{ email }}</span>
    </div>
    
    <button mat-flat-button color="warn" (click)="logout.emit()" class="flex items-center gap-2 bg-red-600/10 hover:bg-red-600/20 text-red-400 border border-red-500/20 rounded-lg py-1.5 px-3">
      <mat-icon class="scale-90">logout</mat-icon>
      <span>Sign Out</span>
    </button>
  </div>
</header>
