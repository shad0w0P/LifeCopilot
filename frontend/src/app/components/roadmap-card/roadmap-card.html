<!-- Presentational Roadmap Card Widget -->
<div class="bg-slate-950/60 p-5 rounded-xl border border-slate-850 hover:border-slate-700/80 flex items-start gap-4 transition duration-300">
  <div class="w-12 h-12 rounded-xl bg-slate-900 flex items-center justify-center text-slate-500 border border-slate-800">
    <mat-icon>{{ icon }}</mat-icon>
  </div>
  <div>
    <h4 class="text-sm font-semibold text-slate-300">{{ title }}</h4>
    <p class="text-xs text-slate-500 mt-1 leading-relaxed">{{ description }}</p>
    <span class="inline-block bg-indigo-500/10 text-indigo-400 text-[10px] font-bold tracking-wider uppercase px-2 py-0.5 rounded mt-2 border border-indigo-500/10">Phase 2 Plan</span>
  </div>
</div>
